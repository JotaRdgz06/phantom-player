<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Phantom player</title>
    </head>
    <body>
        <h1>Hola mundo</h1>
        <input type="file" id="cancion" accept="audio/mpeg" multiple>
    <br>
        <audio id="audio" controls>
        </audio>

        <script>
            let contador = 0;
            const contenido = document.querySelector("#cancion");
            contenido.addEventListener("change", function(){
                for (let i=0; i<contenido.files.length;i++){
                    console.log(contenido.files[i].name);
                }
                if (contenido.files.length > 0){
                    cancionActual();
                }
            })
            const audioActual = document.querySelector("#audio")
            audioActual.addEventListener("ended", function(){
                contador+=1;
                bucle();
                console.log(" contador actualizado: " + contador);
                cancionActual();
            })
            function cancionActual(){
                const actual = URL.createObjectURL(contenido.files[contador]);
                    console.log(actual);
                    audioActual.src = actual;
                    audioActual.play();
                    console.log("now playing: " + contenido.files[contador].name + "contador: " + contador)
            }
            function bucle(){
                if (contador >= contenido.files.length){
                    contador = 0;
                }
            }
        </script>

    </body>
</html>
