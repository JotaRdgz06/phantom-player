<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Phantom player</title>
    </head>
    <body>
        <h1>Hola mundo</h1>
        <input type="file" id="cancion" accept="audio/mpeg" multiple>
    <br>
        <audio id="audio" controls>
        </audio>

        <p>Reproduciendo ahora: <span id="reproduciendoAhora"></span></p>
        <section>
            <h3>Canciones agregadas: </h3>
            <ol id="cancionesAgregadas"></ol>
        </section>

        <script>
            let contador = 0;
            const playlist = [];
            const lista = document.querySelector("#cancionesAgregadas")
            const contenido = document.querySelector("#cancion");
            const reproduciendo = document.querySelector("#reproduciendoAhora")
            contenido.addEventListener("change", function(){
                const playListVacia = playlist.length === 0;
                for (let i=0; i<contenido.files.length;i++){
                    const cancionNueva = document.createElement("li");
                    console.log("Añadido: " + contenido.files[i].name);
                    playlist.push(contenido.files[i]);
                    cancionNueva.textContent = contenido.files[i].name;
                    lista.appendChild(cancionNueva);
                }
                if (playListVacia){
                    cancionActual();
                }
            })
            const audioActual = document.querySelector("#audio")
            audioActual.addEventListener("ended", function(){
                contador+=1;
                bucle();
                console.log("contador actualizado: " + contador);
                cancionActual();
            })
            function cancionActual(){
                const actual = URL.createObjectURL(playlist[contador]);
                    console.log(actual);
                    audioActual.src = actual;
                    audioActual.play().catch(function (error) {
                        console.log("play falló: " + error.name);
                    });
                    console.log("now playing: " + playlist[contador].name + " contador: " + contador)
                    console.log("\n")
                    mostrarCancionActual();
            }
            function bucle(){
                if (contador >= playlist.length){
                    contador = 0;
                }
            }
            function mostrarCancionActual(){
                document.querySelector("#reproduciendoAhora").textContent = playlist[contador].name;
            }
        </script>
    </body>
</html>
